<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
<title id="title">RAG voice agent pipeline</title><desc id="desc">Approved sources are extracted and validated into text and structured stores. Visitor speech reaches a cloud conversational model that calls local retrieval tools, receives evidence, generates an answer, and streams speech to the handset.</desc>
